# 측정 환경(NFR-037) 오버레이. 기본 compose.yaml 위에 얹어 쓴다 — loadtest/run.sh가 이 명령을 감싼다.
#   docker compose -p smart-loadtest -f compose.yaml -f loadtest/compose.yaml ...
# 앱(Spring·FastAPI·PostgreSQL)은 같은 코어 2개를 나눠 쓰고(cpuset, t3.small의 2 vCPU처럼 서로 경쟁),
# 메모리는 합쳐서 2GiB(1g + 512m + 512m)다. 가짜 LLM은 제한 밖의 다른 코어에 둔다. k6는 호스트에서 돈다.
# 개발 환경과 섞이지 않게 프로젝트 이름(smart-loadtest)과 이미지 이름을 따로 쓴다(볼륨도 프로젝트별이다).
services:
  db:
    cpuset: "0,1"
    mem_limit: 512m
    ports: !reset []

  server:
    image: smart-loadtest-server
    cpuset: "0,1"
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m # 메모리 2GiB 호스트의 JVM 기본 힙(1/4)과 같다
      SPRING_PROFILES_ACTIVE: loadtest # /actuator/prometheus를 연다(application-loadtest.properties)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null"]
      interval: 5s
      retries: 40

  ai:
    image: smart-loadtest-ai
    cpuset: "0,1"
    mem_limit: 512m
    environment:
      OPENAI_API_KEY: fake
      OPENAI_BASE_URL: http://fake-llm:9000/v1
    depends_on:
      fake-llm:
        condition: service_healthy

  # 가짜 LLM(NFR-029). 앱 이미지에 없는 ai/loadtest를 마운트해서 쓴다.
  fake-llm:
    build: ./ai
    image: smart-loadtest-ai
    cpuset: "2-5"
    command:
      ["uv", "run", "--no-sync", "uvicorn", "loadtest.fake_llm:app", "--host", "0.0.0.0", "--port", "9000"]
    volumes:
      - ./ai/loadtest:/app/loadtest:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 3s
      retries: 20

  # 시드(loadtest/seed.py): 회원·계좌·송금 내역·DART 데이터. 한 번 돌고 끝난다. Spring이 Flyway를 돌린 뒤에 실행한다.
  seed:
    build: ./ai
    image: smart-loadtest-ai
    profiles: [tools]
    command: ["uv", "run", "--no-sync", "python", "/loadtest/seed.py"]
    environment:
      PYTHONPATH: /app # 스크립트가 /loadtest에 있어도 앱 모듈을 읽는다
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_USERS: ${SEED_USERS:-10000}
    volumes:
      - ./loadtest:/loadtest:ro
      - ./ai/loadtest:/app/loadtest:ro
    depends_on:
      server:
        condition: service_healthy
