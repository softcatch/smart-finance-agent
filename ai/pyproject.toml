[project]
name = "smart-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
