name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Playwright가 크로미움을 실행하려면 리눅스 시스템 패키지가 필요하다(sudo, ubuntu-latest만 해당)
      - run: ./gradlew playwrightInstallDeps
      # 테스트는 Testcontainers(pgvector)로 실제 PostgreSQL에서 돈다
      - run: ./gradlew spotlessCheck test

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # 입구(nginx, NFR-053): 자체 서명 인증서와 가짜 upstream으로 설정의 동작을 확인한다(Let's Encrypt는 제외).
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: nginx/test.sh
