name: Deploy

# main에 머지(push)되면 이미지를 빌드해 Docker Hub에 올리고, 홈서버에 SSH로 접속해 새 이미지로 다시 띄운다.
# 필요한 Secrets·Variables와 서버 준비는 README의 '배포' 절을 본다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치면 앞 배포가 끝난 뒤에 이어서 한다(도중에 끊지 않는다).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/smart-finance-agent-server
      AI_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/smart-finance-agent-ai
    steps:
      - uses: actions/checkout@v7

      # 빌드에 시간을 쓰기 전에 값과 SSH 접속부터 확인한다.
      - name: 서버 접속 준비
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name 값이 비어 있습니다. README의 '배포' 절을 보고 Secrets·Variables에 넣어 주세요."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::홈서버 SSH에 닿지 않습니다. SSH_HOST·SSH_PORT, 공유기 포트포워딩, 서버 방화벽을 확인하세요."
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host homeserver
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
          EOF
          ssh homeserver true

      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 서버 CPU 구조(x86·ARM)를 가리지 않게 두 구조를 만든다. 캐시 덕에 바뀐 층만 다시 만든다.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: server 이미지
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # collector도 이 이미지를 쓴다(명령만 다르다).
      - name: ai 이미지
        uses: docker/build-push-action@v7
        with:
          context: ai
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:latest
            ${{ env.AI_IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

      # compose.yaml은 매번 서버에 맞춰 둔다. .env(비밀값)는 서버에만 있다.
      - name: 홈서버에 배포
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          ssh homeserver 'mkdir -p ~/smart-finance-agent'
          scp compose.yaml homeserver:smart-finance-agent/compose.yaml
          # 값은 여기서 펼쳐 서버로 넘긴다(의도한 동작)
          # shellcheck disable=SC2029
          ssh homeserver "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/smart-finance-agent
          if [ ! -f .env ]; then
            echo "~/smart-finance-agent/.env가 없습니다. README의 '배포' 절을 따라 만들어 주세요."
            exit 1
          fi
          # Docker Hub 이미지를 받아 compose가 쓰는 이름으로 태그한다.
          for name in server ai; do
            docker pull "$DOCKERHUB_USERNAME/smart-finance-agent-$name:$IMAGE_TAG"
            docker tag "$DOCKERHUB_USERNAME/smart-finance-agent-$name:$IMAGE_TAG" "smart-finance-agent-$name:latest"
          done
          docker compose up -d
          # 이전 배포의 이미지는 지운다. Docker Hub에 남아 있어 필요하면 다시 받을 수 있다.
          for name in server ai; do
            docker images --format '{{.Repository}}:{{.Tag}}' "$DOCKERHUB_USERNAME/smart-finance-agent-$name" \
              | grep -v ":$IMAGE_TAG\$" | xargs -r docker rmi || true
          done
          # 서버가 올라왔는지 본다(Flyway 마이그레이션 때문에 수십 초 걸릴 수 있다).
          for _ in $(seq 40); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "배포 완료: $IMAGE_TAG"
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=50 server
          exit 1
          REMOTE
