services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 로컬 개발용: IDE·클라이언트에서 DB에 접속할 수 있게 127.0.0.1에만 연다
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SMART_JWT_SECRET: ${SMART_JWT_SECRET}
      SMART_AI_BASE_URL: http://ai:8000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # 내부 전용: 포트를 밖으로 열지 않는다(Spring만 호출)
  ai:
    build: ./ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      # 비우면(OPENAI_REASONING_EFFORT=) 추론 강도 인자를 빼서 추론을 안 쓰는 모델도 쓸 수 있다
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT-low}
      SMART_SERVER_BASE_URL: http://server:8080

  # DART 재무 수집 스케줄러(하루 1회). API 서버와 같은 이미지에 명령만 다르다.
  # 재무 테이블은 이 컨테이너가 DB에 직접 쓴다(FastAPI 소유). DART_API_KEY가 없으면 안내만 하고 다음 주기를 기다린다.
  collector:
    build: ./ai
    command: ["sh", "-c", "while true; do uv run --no-sync python -m app.collect; sleep 86400; done"]
    environment:
      DART_API_KEY: ${DART_API_KEY:-}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
