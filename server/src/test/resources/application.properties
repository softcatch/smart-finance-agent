# 테스트 전용 값(실서비스 비밀값 아님)
smart.jwt.secret=test-only-secret-key-32-bytes-min!!
smart.jwt.expiration-seconds=60
# 이 아이디로 가입하면 관리자다(AuthControllerTest 한 곳에서만 쓴다 — 아이디가 유일해서 한 번만 가입된다)
smart.admin.login-ids=admin-by-config
# 채팅 테스트는 @DynamicPropertySource로 가짜 FastAPI 주소·짧은 타임아웃을 덮어쓴다.
smart.ai.base-url=http://localhost:8000
smart.ai.read-timeout=10s
smart.ai.detail-read-timeout=30s
smart.ai.daily-token-limit=500000

server.forward-headers-strategy=native

# 테스트 classpath에서는 이 파일이 main의 application.properties를 완전히
# 덮어써서(병합 아님) JSP 뷰 리졸버 설정도 여기 다시 적어야 한다.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
