spring.application.name=smart
# DB 접속은 SPRING_DATASOURCE_URL·USERNAME·PASSWORD 환경변수로 받는다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# FastAPI가 같은 스키마에 먼저 만든 테이블(company·financial)이 있어도 마이그레이션한다.
# 이력 테이블이 없는 스키마는 버전 0으로 기준을 잡고 V1부터 적용한다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# smart.jwt.secret은 SMART_JWT_SECRET 환경변수로 받는다(필수, 32자 이상)
smart.jwt.expiration-seconds=3600
# 관리자 아이디 목록(쉼표로 구분, FR-030). 이 아이디로 먼저 가입한 사람이 관리자가 된다.
# SMART_ADMIN_LOGIN_IDS 환경변수로 받는다. 이미 가입한 회원은 운영자가 member.role을 ADMIN으로 바꿔 지정한다.
smart.admin.login-ids=
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# FastAPI는 SMART_AI_BASE_URL 환경변수로 주소를 받는다. 읽기 10초 넘으면 채팅만 실패(NFR-003).
smart.ai.base-url=http://localhost:8000
smart.ai.read-timeout=10s
# 상세 보기 보고서는 클릭할 때 LLM이 만들어 7~10초가 걸린다(실측). 채팅보다 길게 기다린다.
smart.ai.detail-read-timeout=30s
# 사용자별 하루 AI 사용 한도(토큰, 입력+출력, NFR-054). 오늘(KST) 합계가 이 값 이상이면 채팅·상세 보기를 거절한다.
smart.ai.daily-token-limit=500000
