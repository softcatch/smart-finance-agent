spring.application.name=smart
# DB 접속은 SPRING_DATASOURCE_URL·USERNAME·PASSWORD 환경변수로 받는다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# FastAPI가 같은 스키마에 먼저 만든 테이블(company·financial)이 있어도 마이그레이션한다.
# 이력 테이블이 없는 스키마는 버전 0으로 기준을 잡고 V1부터 적용한다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# smart.jwt.secret은 SMART_JWT_SECRET 환경변수로 받는다(필수, 32자 이상)
smart.jwt.expiration-seconds=3600
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# FastAPI는 SMART_AI_BASE_URL 환경변수로 주소를 받는다. 읽기 10초 넘으면 채팅만 실패(NFR-003).
smart.ai.base-url=http://localhost:8000
smart.ai.read-timeout=10s
